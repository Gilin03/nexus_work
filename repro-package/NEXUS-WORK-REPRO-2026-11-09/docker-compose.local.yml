services:
  mysql-local:
    image: mysql:8.4
    container_name: nexus-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      NEXUS_APP_PASSWORD: ${NEXUS_APP_PASSWORD:?Set NEXUS_APP_PASSWORD in .env}
      NEXUS_CONF_PASSWORD: ${NEXUS_CONF_PASSWORD:?Set NEXUS_CONF_PASSWORD in .env}
    ports:
      - "127.0.0.1:3308:3307"
    volumes:
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./db/schema.sql:/seed/schema.sql:ro
      - ./db/grants.sql:/seed/grants.sql:ro
      - nexus-local-mysql-data:/var/lib/mysql
    command: ["--port=3307", "--local-infile=0", "--secure-file-priv=NULL"]
    mem_limit: 768m

volumes:
  nexus-local-mysql-data:
